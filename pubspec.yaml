name: chobiflow
description: "ChobiFlow - Flow through your screenshots. Auto-organize, search, and rediscover."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  animations: ^2.1.0
  flutter_staggered_grid_view: ^0.7.0
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  intl: ^0.20.2
  image_picker: ^1.1.2
  share_plus: ^11.1.0
  photo_manager: ^3.8.1
  google_mlkit_text_recognition: ^0.15.0
  flutter_onnxruntime: ^1.8.1
  path_provider: ^2.1.0
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
